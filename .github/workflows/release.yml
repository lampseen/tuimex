name: release

# ADR-051 is why this is a workflow written here and what it builds.
on:
  push:
    tags: ['v*']
  # A dry run: builds and packages every target, publishes nothing. A tag
  # cannot be taken back, so the first release should not be the first time
  # this workflow runs.
  workflow_dispatch:

# Each job reads the repository and no more; the one that publishes says
# what else it needs.
permissions:
  contents: read

# Two runs for one tag would race to create one release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gates run again here rather than trusting the branch: a tag can be
  # pushed at any commit, including one CI never saw.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make check
      # Cargo.toml holds the one written version; a hand-made tag that
      # disagrees would stamp binaries with a number the source does not have.
      - name: the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says $v"; exit 1; }

  # Every target is built on a runner of its own system, and the two Linux
  # ones on one of its own architecture: SQLite and ring are C, compiled by
  # the `cc` each image carries (gcc on the Ubuntu images, Apple's clang on
  # the Mac ones), so no cross toolchain or sysroot is installed here.
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest Ubuntu images build the Linux binaries, so they run
          # on any glibc at least that old.
          - { os: ubuntu-22.04, builds: 'x86_64-unknown-linux-gnu=linux_amd64' }
          - { os: ubuntu-22.04-arm, builds: 'aarch64-unknown-linux-gnu=linux_arm64' }
          # One Mac builds both Mac binaries. GitHub has retired its Intel
          # macOS images, and Apple silicon builds the Intel binary as a
          # cross target with the one SDK; a second job would only be a
          # second wait for a Mac runner, and those are the scarce ones.
          # Not pinned to a macOS version, as ci.yml is not: a pinned image
          # is withdrawn in time, and a job on a withdrawn image is
          # cancelled before it starts.
          - { os: macos-latest, builds: 'x86_64-apple-darwin=darwin_amd64 aarch64-apple-darwin=darwin_arm64' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cc --version
      # No version in an archive's name, so /releases/latest/download/ URLs
      # stay stable across releases. What `file` says of each binary is
      # checked before it is packaged, so a build for the wrong machine
      # never is.
      - name: build, check and package each target
        env:
          BUILDS: ${{ matrix.builds }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for build in $BUILDS; do
            target=${build%%=*}
            name=${build##*=}
            case "$target" in
              x86_64-unknown-linux-gnu) is='ELF 64-bit.*x86-64' ;;
              aarch64-unknown-linux-gnu) is='ELF 64-bit.*aarch64' ;;
              x86_64-apple-darwin) is='Mach-O 64-bit.*x86_64' ;;
              aarch64-apple-darwin) is='Mach-O 64-bit.*arm64' ;;
              *) echo "::error::no check for $target"; exit 1 ;;
            esac
            rustup target add "$target"
            cargo build --release --locked --target "$target"
            file "target/$target/release/tuimex" | tee file.txt
            grep -Eq "$is" file.txt
            rm -rf dist/pkg && mkdir -p dist/pkg
            cp "target/$target/release/tuimex" LICENSE README.md dist/pkg/
            tar -czf "dist/tuimex_$name.tar.gz" -C dist/pkg tuimex LICENSE README.md
            rm -rf dist/pkg
          done
      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.os }}
          path: dist/tuimex_*.tar.gz
          if-no-files-found: error

  # On a dry run this job still gathers the archives and writes the
  # checksums, so the only steps a tag runs for the first time are the two
  # that cannot be undone.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Keyless signing: id-token mints the OIDC token that binds the
      # certificate to this workflow, attestations writes the result. There
      # is no private key to keep.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum tuimex_*.tar.gz | tee checksums.txt && test "$(wc -l < checksums.txt)" -eq 4
      # Everything the release page offers, checksums included: attesting
      # the archives alone would leave the file that vouches for them
      # swappable by whoever could swap them.
      - id: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/tuimex_*.tar.gz
            dist/checksums.txt
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/attestation.jsonl
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "tuimex ${GITHUB_REF_NAME#v}"
